translation: 春天的早上睡得真香,天亮了都不知道。醒来听见到处都是小鸟的叫声。想起夜里好像有风雨的声音,不知道花儿被吹落了多少。
background: 孟浩然住在山里的一个小屋子。春天的早晨,他听着鸟叫醒来,想起夜里的风雨,写下了这首诗。
