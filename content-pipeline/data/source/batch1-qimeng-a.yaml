translation: 大白鹅呀大白鹅,弯着脖子朝着天空唱歌。洁白的羽毛浮在碧绿的水面上,红红的脚掌拨动着清清的水波。
background: 传说骆宾王七岁那年,家里来了一位客人。客人指着池塘里的白鹅,想考考这个小神童。骆宾王望着水中游来游去的白鹅,张嘴就吟出了这首诗,客人们都惊呆了。
