translation: 床前洒满了明亮的月光,好像地上铺着一层白白的霜。抬起头看看天上的月亮,低下头就想起了远方的家乡。
background: 李白离开家乡,一个人住在外地。一个安静的夜晚,他看见窗外的月光,想念家里的亲人,就写下了这首诗。
